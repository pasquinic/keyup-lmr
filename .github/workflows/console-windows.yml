name: Console · Windows build

# Builds the KeyUp Dispatch Console (fork of DVMProject dvmconsole) for Windows.
# Output: a self-contained win-x86 folder (no .NET install needed) with libvocoder.dll, zipped.
# Push a tag named console-v* (e.g. console-v1.0.0) to also publish it as a GitHub Release.
on:
  push:
    branches: [main]
    paths: ["console/**", ".github/workflows/console-windows.yml"]
    tags: ["console-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build libvocoder.dll (x86, static MSVC runtime)
        shell: pwsh
        run: |
          cmake -S console/dvmvocoder -B vocoder-build -A Win32 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build vocoder-build --config Release
          Get-ChildItem -Recurse vocoder-build -Filter libvocoder.dll | Select-Object -First 1 | Copy-Item -Destination libvocoder.dll

      - name: Publish the console (win-x86, self-contained)
        shell: pwsh
        run: |
          dotnet publish console/dvmconsole/DVMConsole.csproj -c Release -r win-x86 --self-contained true `
            -p:PlatformTarget=x86 -o publish
          Copy-Item libvocoder.dll publish/
          New-Item -ItemType Directory -Force publish/examples | Out-Null
          Copy-Item console/configs/*.yml publish/examples/
          Copy-Item console/LICENSE publish/LICENSE.txt
          Copy-Item console/README.md publish/README.md
          Copy-Item console/FORK.md publish/FORK.md

      - name: Package
        shell: pwsh
        run: |
          if (!(Test-Path publish/DVMConsole.exe)) { throw "DVMConsole.exe missing from publish output" }
          Rename-Item publish "KeyUp Dispatch Console"
          Compress-Archive -Path "KeyUp Dispatch Console" -DestinationPath KeyUp-Dispatch-Console-win-x86.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KeyUp-Dispatch-Console-win-x86
          path: KeyUp-Dispatch-Console-win-x86.zip

      - name: Publish GitHub Release (console-v* tags)
        if: startsWith(github.ref, 'refs/tags/console-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" KeyUp-Dispatch-Console-win-x86.zip `
            --title "KeyUp Dispatch Console ${{ github.ref_name }}" `
            --notes "Windows dispatch console for KeyUp (fork of DVMProject dvmconsole, AGPL-3.0). Unzip, run DVMConsole.exe, then File > Connect to KeyUp Server. See README.md inside."
