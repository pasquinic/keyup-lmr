name: Console · Windows build

# Builds the KeyUp Dispatch Console for Windows (x64): an installer (Inno Setup) that also installs the
# KeyUp Tunnel service, and a portable zip. The official WireGuardNT wireguard.dll is downloaded from
# download.wireguard.com and shipped unmodified next to the program (its own permissive license).
# Push a tag named console-vX.Y.Z to also publish them as a GitHub Release.
on:
  push:
    branches: [main]
    paths: ["console/**", ".github/workflows/console-windows.yml"]
    tags: ["console-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WIREGUARD_NT: "0.10.1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          if ("${{ github.ref }}" -like "refs/tags/console-v*") { $v = "${{ github.ref_name }}".Substring(9) }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Get WireGuardNT (official wireguard.dll)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://download.wireguard.com/wireguard-nt/wireguard-nt-$env:WIREGUARD_NT.zip" -OutFile wgnt.zip
          Expand-Archive wgnt.zip -DestinationPath wgnt
          Copy-Item wgnt/wireguard-nt/bin/amd64/wireguard.dll console/src/KeyUp.Console/wireguard.dll

      - name: Publish (win-x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish console/src/KeyUp.Console/KeyUp.Console.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.v.outputs.version }} -o publish
          if (!(Test-Path publish/KeyUpConsole.exe)) { throw "KeyUpConsole.exe missing" }
          if (!(Test-Path publish/wireguard.dll)) { throw "wireguard.dll missing" }
          Copy-Item wgnt/wireguard-nt/LICENSE.txt publish/WIREGUARD-NT-LICENSE.txt
          Copy-Item console/LICENSE.txt publish/LICENSE.txt
          Copy-Item console/README.md publish/README.md

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ steps.v.outputs.version }} "/DPublishDir=$pwd\publish" console/installer/KeyUpConsole.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable zip
        shell: pwsh
        run: |
          Rename-Item publish "KeyUp Dispatch Console"
          Compress-Archive -Path "KeyUp Dispatch Console" -DestinationPath "dist/KeyUp-Dispatch-Console-${{ steps.v.outputs.version }}-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: KeyUp-Dispatch-Console-${{ steps.v.outputs.version }}
          path: dist/*

      - name: GitHub Release (console-v* tags)
        if: startsWith(github.ref, 'refs/tags/console-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*).FullName `
            --title "KeyUp Dispatch Console ${{ steps.v.outputs.version }}" `
            --notes "Windows dispatch console for KeyUp. Run the Setup (installs the KeyUp Tunnel service for the built-in WireGuard tunnel), then Connect to KeyUp with the code from the web UI (Dispatch Consoles > Activate). The portable zip runs without installing (HTTPS only, or the tunnel when run as administrator)."
