name: Mobile · Android build

# Builds an installable APK of the KeyUp PoC app on every change to mobile/.
# Signing: add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to sign with your own key; without them the
# APK is signed with the Android debug key (fine for side-loading onto your own phones).
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --legacy-peer-deps
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign with your key (when the secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/release.keystore
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
            "$BT/apksigner" sign --ks /tmp/release.keystore --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS --out "$APK" /tmp/aligned.apk
            echo "Signed with the release key"
          else
            echo "No keystore secrets: APK is signed with the debug key"
          fi
          cp "$APK" ../KeyUp-PoC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyUp-PoC-android
          path: KeyUp-PoC.apk
