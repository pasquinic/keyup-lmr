name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server tests (native backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r central/requirements.txt -r edge/requirements.txt pytest pyyaml
      - run: PYTHONPATH=.:central pytest -q tests
      - run: python3 tests/lab_e2e.py
      - run: python3 tests/lab_rules_e2e.py

  labs:
    name: Feature + packet-voice labs (PoC, consoles, recording, DFSI / IPSC / Cap+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: pip install -r central/requirements.txt -r edge/requirements.txt pyyaml
      - run: python3 tests/lab_features_e2e.py
      - run: python3 tests/lab_packet_e2e.py

  mobile:
    name: Mobile app checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npx eslint src
      - run: npm test
