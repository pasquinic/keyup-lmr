name: Mobile · EAS build (signed iOS + Android)

# Signed, installable builds through Expo Application Services.
# One-time setup: create a free Expo account, run `cd mobile && npx eas-cli@latest init`
# (commits the project id into app.json), run one interactive `eas build` to let EAS create
# or import your Apple / Android credentials, then add an EXPO_TOKEN repository secret.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: "Build profile (eas.json)"
        type: choice
        options: [preview, production, simulator]
        default: preview

jobs:
  eas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev > Account settings > Access tokens)"; exit 1
          fi
      - run: npm ci --legacy-peer-deps
      - name: Start EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
