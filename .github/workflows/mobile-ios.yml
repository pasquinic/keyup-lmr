name: Mobile · iOS build

# Builds the KeyUp PoC app for the iOS Simulator (no Apple account needed) to prove the
# iOS project compiles. For a signed build you can install on iPhones or submit to the
# App Store, run the "Mobile · EAS build" workflow (uses your Apple account through Expo).
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile-ios.yml"]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Generate the native iOS project (runs pod install)
        run: npx expo prebuild --platform ios --clean
      - name: Build for the iOS Simulator
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace KeyUp.xcworkspace -scheme KeyUp -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -50
      - name: Package
        working-directory: mobile/ios/build/Build/Products/Release-iphonesimulator
        run: ditto -c -k --sequesterRsrc --keepParent KeyUp.app "$GITHUB_WORKSPACE/KeyUp-PoC-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: KeyUp-PoC-ios-simulator
          path: KeyUp-PoC-simulator.zip
