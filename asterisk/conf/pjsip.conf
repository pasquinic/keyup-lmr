; ---------------------------------------------------------------------------
; SIP endpoints for the LMR interconnect. Replace the examples and passwords.
; ---------------------------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ---- template for desk phones / softphones / dispatch consoles ----
[phone](!)
type = endpoint
context = lmr-phones
disallow = all
allow = ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[auth-phone](!)
type = auth
auth_type = userpass

[aor-phone](!)
type = aor
max_contacts = 2
remove_existing = yes

; ---- example phone 1001 ----
[1001](phone)
auth = 1001
aors = 1001
[1001](auth-phone)
username = 1001
password = CHANGE_ME_1001
[1001](aor-phone)

