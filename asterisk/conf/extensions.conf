; Calls are handed to the LMR central server through ARI (Stasis app "lmr").
; Talkgroups are reached by their "SIP extension" (set per talkgroup in the web UI)
; or by the numeric TGID. Phones press * to talk and # to release.

[lmr-phones]
exten => _X.,1,NoOp(LMR patch to talkgroup ${EXTEN})
 same => n,Stasis(lmr,inbound,${EXTEN})
 same => n,Hangup()

; DIDs from a PBX / carrier: map the dialled number to a talkgroup extension.
[lmr-trunk]
exten => _X.,1,NoOp(Inbound trunk call ${EXTEN})
 same => n,Stasis(lmr,inbound,${EXTEN})
 same => n,Hangup()
